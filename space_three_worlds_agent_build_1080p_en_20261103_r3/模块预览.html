<script>const modules=[{"id": "01_intro", "title": "EntropyDrop Space: Game Introduction & Gameplay Showcase", "label": "开场介绍", "text": "Hey everyone. Today, I want to introduce EntropyDrop Space, a 3D voxel game running directly in your web browser. In Space, the world isn't just a sandbox made of blocks—it's an interactive, playable world. Building a drivable machine in traditional sandbox games often takes hours of manual block placement and scripting, while typical generative 3D models tend to be static decorations you can neither customize nor actually play with.\n\nThe core idea behind Space is bringing AI co-creation and voxel sandbox gameplay together: describe what you want in plain words, and an AI Agent helps build functional mechanisms and control scripts for you. At the same time, you retain complete creative control—sculpting micro details with hands-on tools, and jumping into the driver's seat to explore the world yourself. Today, we'll walk through three distinct worlds to showcase how the systems and gameplay in Space actually work.\n", "video": "modules/01_intro/preview.mp4"}, {"id": "02_aether_tour", "title": "Aether Archipelago: AI Collaboration and Goal-Driven Design", "label": "空岛地形环顾", "text": "Here in Aether Archipelago, the terrain gives us a design problem. How do we cross a gap, transport supplies, or let a machine handle repetitive work? We want players to start with a goal, build a solution, and test it in the world.\n\nAI is a design partner. Describe appearance, structure, and behavior in plain language, and it can help build vehicles and write their control code. The same idea extends to following or patrolling drones, and bot players that interact with people. Generation is only the beginning: the toolbar lets you refine, test, and make the result your own.\n\nWe also want to extend this collaboration to automated construction. Imagine an agent directing a road-building robot: it reads the terrain ahead and lays a route as it moves. Vehicles, robots, and the world become connected. You set a goal, AI helps implement it, and real operation puts the design to the test.\n", "video": "modules/02_aether_tour/preview.mp4"}, {"id": "03_toolbar", "title": "The Creator's Toolkit: Core Mechanics & Micro-Voxel Workflow", "label": "工具栏设计与用法", "text": "The toolbar at the bottom anchors your moment-to-moment gameplay. Selector defines 3D regions; Hammer places inventory items; and Wrench grabs, rotates, and configures active entities. Shovel shapes standard one-meter blocks, while Spoon operates at an ultra-fine one-eighth of a meter micro-voxel scale.\n\nBrush changes colors and materials on the fly, while Modeling adds lightweight visual decorations. Keys one through seven let you cycle through tools instantly, with contextual controls updating dynamically to keep the workflow clean and intuitive.\n\nThis toolkit ensures you are never trapped by an AI black box. The agent drafts the heavy architecture, while you always hold the precise, intuitive power to refine, personalize, and leave your own creative mark.\n", "video": "modules/03_toolbar/preview.mp4"}, {"id": "04_agent", "title": "Connect Agent Build: The AI Co-Creation System", "label": "Agent Build 授权与工作流", "text": "Here is the centerpiece of Space: the Agent Build system. Simply open the panel and copy the prompt to your favorite external AI agent. Through open interfaces, it connects directly into your active voxel world.\n\nWhether using cloud frontier models or local AI, the agent becomes your versatile co-builder. It interprets everyday natural language, computing 3D geometry, placing blocks, and writing full controller scripts in seconds.\n\nThis connection seamlessly carries across every world you visit. Now, let's dive into our first live build!\n", "video": "modules/04_agent/preview.mp4"}, {"id": "05_chinook_prompt", "title": "Live Build: Generating a Tandem-Rotor Helicopter", "label": "支奴干构建请求", "text": "In Aether Archipelago, we need a heavy transport capable of leaping between floating islands: a tandem-rotor Chinook helicopter. Prompting the agent in Space is effortless, combining aesthetics, structure, and flight behavior in a single request:\n\nWe ask the agent to build an olive transport helicopter with a readable cockpit, a hollow walk-in cabin, landing wheels, and a functional pilot seat. The two rotors should be independent components spinning in opposite directions, powered by thrust and attitude torque, with W and S controlling pitch, A and D turning, and the Spacebar and Shift keys managing altitude.\n", "video": "modules/05_chinook_prompt/preview.mp4"}, {"id": "06_chinook_inspect", "title": "Vehicle Architecture: Multi-Component Assembly & Automation", "label": "支奴干模型检查", "text": "The generation finishes in seconds. Right away, you can see the fuselage and the two rotor assemblies are independent, active components.\n\nThe pilot seat is a standout feature: in Space, this is a fully functional interaction definition with boarding logic and input mapping, not just a static cushion drawn inside the cabin.\n\nInspecting the exterior, the rotor spacing gives a clear tandem profile, with generous ground clearance under the wheels. Best of all, the entire flight controller was generated and compiled automatically by the agent—from counter-rotating torque cancellation to auto-hover logic, the complex math is handled behind the scenes so you can jump straight into the fun of flying.\n", "video": "modules/06_chinook_inspect/preview.mp4"}, {"id": "07_chinook_refine", "title": "Hands-On Polish: Sculpting Micro-Voxels & Custom Paint", "label": "勺子与画笔修补", "text": "Now let's see how effortless it is to customize an AI-generated build. We switch into first-person and pause the entity to begin editing.\n\nSelecting Spoon brings up a targeted reticle focused on an eighth-meter micro-voxel. We carve out a clean notch along the edge without removing a full standard block, shaping the airframe with sculptural precision.\n\nSwitching to Brush, we pick an accent color and paint a custom livery detail. This is where Space shines: the AI handles the heavy structural engineering, and in just a few seconds with your own hands, you make the machine truly your own.\n", "video": "modules/07_chinook_refine/preview.mp4"}, {"id": "08_chinook_controls", "title": "Boarding & Cockpit: Zero-Code Flying", "label": "直升机控制与登机", "text": "Before taking off, we take a quick look at the fuselage controller. The script listens automatically for driver mounting, ensuring flight controls only engage when you are safely in the seat.\n\nClose the editor, aim at the pilot seat, and press V to board. Hitting F three toggles our third-person perspective, giving us an expansive view of both the rotors and the archipelago.\n\nIn traditional sandbox games, building a working multi-rotor aircraft required writing pages of scripts and tedious physics tuning that scared off most players. In Space, you don't need any coding or aerospace knowledge. Attitude control, key bindings, and auto-hover stabilization are fully automated by the agent in seconds. You just board the cockpit, and let your intelligent co-builder handle the rest.\n", "video": "modules/08_chinook_controls/preview.mp4"}, {"id": "09_chinook_flight_a", "title": "Maiden Flight: Responsive Controls & Cruising", "label": "支奴干起飞", "text": "Hit the throttle, and the helicopter lifts off smoothly from the grass into a clean vertical climb! Nudging forward input pitches the nose down as thrust propels us forward.\n\nReleasing the keys commands the controller to decelerate and settle into a stable hover. Our first turn is wide and deliberate: a heavy tandem transport should feel substantial, carrying realistic momentum and weight rather than feeling twitchy.\n\nAs the castle slips behind us, sunlight cuts across the skyward ring, revealing an incredible panoramic skyline. Testing each axis one at a time lets you appreciate just how responsive and natural the handling feels.\n", "video": "modules/09_chinook_flight_a/preview.mp4"}, {"id": "10_chinook_flight_b", "title": "Island Transit: Freedom of Skyward Exploration", "label": "支奴干环绕飞行", "text": "Cruising over the islands in third-person, the silhouette of the Chinook stands out sharply against the floating terrain, making spatial navigation effortless without needing a minimap.\n\nThroughout every turn and descent, the aircraft maintains rock-solid self-stabilization—simply letting go of the controls parks it in mid-air, a testament to the intelligent auto-hover code generated by the agent.\n\nThis machine unlocks the true gameplay of Aether Archipelago: impassable voids are now open airways, and remote castles become landing sites waiting to be explored.\n\nThe seamless world streaming keeps distant terrain and the massive ring continuous throughout our flight. With our aerial test complete, it's time to head to our second world for some high-speed off-road driving!\n", "video": "modules/10_chinook_flight_b/preview.mp4"}, {"id": "11_nature_tour", "title": "Nature: Land Expedition & Route Planning", "label": "Nature 地形游览", "text": "Welcome to our second world: Nature. In Agent Build, we simply update our target world to Nature.\n\nUnlike the vertical drops of Aether, Nature is an expansive rolling wilderness packed with natural slopes, rocky ledges, and stepped grass terraces.\n\nWe pick an open grassy clearing as our starting point. In Space, you don't need to build artificial ramps or test tracks—the rugged procedural earth is already the ultimate off-road proving ground. Here, we're going to build a heavy-duty all-terrain rover.\n\nThis landscape sets the stage for our driving tests: checking low-speed wheel rotation first, testing steering geometry, and finally pushing the independent suspension across natural terraces.\n", "video": "modules/11_nature_tour/preview.mp4"}, {"id": "12_rover_prompt", "title": "Ground Build: Prompting an Independent Suspension Rover", "label": "越野车构建请求", "text": "Our second request to the agent focuses on ground physics: build a sand-colored four-wheel, off-road vehicle with a sturdy chassis, high ground clearance, and prominent headlights.\n\nThe heart of the vehicle is its suspension: dynamic chassis, four independently animated wheels, and spring-and-damper forces calculated at every contact point. The wheels must articulate over bumps with responsive acceleration, steering, braking, and lateral grip.\n\nThis independent raycast suspension delivers authentic mechanical behavior you can feel in every turn, far beyond cosmetic wheels that only spin in place.\n", "video": "modules/12_rover_prompt/preview.mp4"}, {"id": "13_rover_inspect", "title": "Suspension Mechanics: Dynamic Ground Articulation", "label": "悬挂与车体检查", "text": "The rover appears instantly. Dropping our camera to wheel level reveals the setup: a single dynamic chassis root connected to four independently articulated wheel assemblies.\n\nEach wheel samples the terrain in real time. Springs absorb ground impact while dampers suppress unwanted oscillation. Without damping, a chassis bounces uncontrollably after every bump; with too much, it rides like a rigid brick.\n\nIn standard game development, tuning an adaptive multi-wheel suspension is notoriously complex. In Space, the agent generates and balances this entire physics controller automatically. You simply ask for independent suspension, and the AI handles the forces, giving you planted, responsive vehicle handling right out of the box.\n", "video": "modules/13_rover_inspect/preview.mp4"}, {"id": "16_rover_drive_a", "title": "Driving Feel: Forward, Reverse & Tire Traction", "label": "车轮前进与倒退测试", "text": "Hop into the driver's seat and tap the accelerator! We run a low-speed crawl forward and backward at ground level to examine tire rotation.\n\nRelative to the chassis, the contact patch of each tire must sweep backward against the terrain as the vehicle drives forward, reversing smoothly when backing up.\n\nThe wide treads grip the grass naturally. Forward acceleration, braking, and reverse motion all synchronize with satisfying mechanical weight. If you ever want to tweak torque or gearing, a single message to your agent updates the script instantly.\n", "video": "modules/16_rover_drive_a/preview.mp4"}, {"id": "17_rover_drive_b", "title": "Off-Road Trail: Steering Control & Hill Climbing", "label": "左右转向与自然台阶越野", "text": "Next, we test steering response. Holding the brake, pressing A steers left, releasing returns to center, and pressing D turns right. The front wheels articulate crisply while the rear axle stays true.\n\nKeeping the steering yaw axis on the chassis and the rolling pitch axis on each wheel prevents high-speed wheel wobble, delivering crisp, predictable control.\n\nRelease the brakes and hammer the throttle across natural terraces! As individual wheels tackle rocks and dirt ledges, the suspension compresses and rebounds smoothly, keeping the chassis level while the amber headlights lead the charge. Conquering the wilderness like this is an absolute blast!\n", "video": "modules/17_rover_drive_b/preview.mp4"}, {"id": "18_copper_tour", "title": "Copper Metropolis: Navigating the Vertical Skyline", "label": "铜城地形游览", "text": "Our final stop brings us to Copper Metropolis. Packed with soaring skyscrapers, this world presents an entirely different navigation challenge from open wilderness.\n\nCopper highlights how effortlessly Space renders dense, multi-tiered urban architecture. Sharp horizontal rooflines make every subtle tilt and attitude change easy to read.\n\nIn this vertical cityscape, we explore an even more advanced gameplay mechanic: instead of manually piloting a vehicle, we ask the agent to create an autonomous companion drone that follows our every move.\n\nThe player becomes the moving target. Starting from a spacious rooftop terrace, we take to the air, giving our drone companion plenty of clear airspace to climb, follow, and hover beside us.\n", "video": "modules/18_copper_tour/preview.mp4"}, {"id": "19_drone_prompt", "title": "Intelligent Companion: Prompting a Character-Following Drone", "label": "跟随无人机构建请求", "text": "To summon this smart aerial companion, we provide the agent with a clear behavioral prompt:\n\nBuild a compact quadcopter companion featuring a dynamic center body, four counter-rotating rotors, landing feet, and a distinct front accent.\n\nWriting a real-time 3D tracking controller that samples velocity, maintains a spatial offset, and handles target loss would normally take hundreds of lines of complex math. In Space, you just describe the behavior in plain English, and the agent automatically writes and compiles the entire autonomous attitude-torque controller for you.\n", "video": "modules/19_drone_prompt/preview.mp4"}, {"id": "20_drone_refine", "title": "Entity Marking: Spraying a Front-Facing Accent", "label": "无人机检查与标记", "text": "The drone appears instantly on the terrace, with four counter-rotating rotor arms clearly defined. The visual spinning animations work hand-in-hand with genuine dynamic physics forces.\n\nBecause quadcopters are geometrically symmetrical, reading their heading during rapid aerial spins can be tricky. We whip out the Brush and paint a vivid front accent badge—a two-second touch that brings instant personality to the drone.\n\nSturdy landing feet ensure clean clearance. While Modeling tools can easily add camera gimbals or cosmetic housings, genuine flight behavior always flows from the underlying physics components.\n", "video": "modules/20_drone_refine/preview.mp4"}, {"id": "21_drone_flight_a", "title": "Synchronized Flight: Continuous Circular Tracking", "label": "角色腾空与无人机跟随", "text": "Now, let's look at how the drone actually behaves in synchronized flight. In third-person, we let the drone settle beside us, then toggle character flight mode and ascend straight into the air.\n\nWe leave the rooftop and keep moving around a wide circle above the city. The drone tracks our position and velocity. To turn, it must redirect thrust and bank, rather than slide straight to a target.\n\nThis is closer to real exploration. With the target always moving, the drone continuously corrects its distance and altitude. Keeping both characters in third person makes the tracking delay and banking easy to see.\n", "video": "modules/21_drone_flight_a/preview.mp4"}, {"id": "22_drone_flight_b", "title": "Continuous Flight: A Drone Companion in Motion", "label": "空中环顾、侧移与悬停", "text": "We continue flying quickly around the large circle. Buildings pass below, the drone keeps catching up, and the camera follows our route so the movement reads as one continuous flight.\n\nWatch the drone bank into each turn, redirecting acceleration rather than sliding sideways. When we change speed, it adjusts thrust to correct the tracking error. It's constantly balancing distance and altitude, so the follower stays responsive while the target keeps moving.\n\nNow we release the controls and let it settle. You choose the route; the drone follows through its own logic. Scouting, patrols, or hauling could give this companion more gameplay roles.\n", "video": "modules/22_drone_flight_b/preview.mp4"}, {"id": "24_backpack_market", "title": "Backpack and Market: Share Creations and Reusable Modules", "label": "背包与市场", "text": "Before we finish, let's open the backpack. Save a vehicle here and place it again later. Think of it as both a collection of finished creations and your own reusable parts library.\n\nTake this rover. Select a wheel component and copy it into the backpack. When you design another vehicle, reuse that wheel, then adjust its size, color, and structure to suit the new build.\n\nThe helicopter works the same way. Save a rotor as its own module, and organize the fuselage and landing gear separately. New vehicles can start by combining existing parts, leaving more time for design and gameplay.\n\nThe market lets you browse other players' creations and share your own. Others can download and reuse a complete vehicle, a single tire, or a rotor assembly. Each contribution can become part of someone else's build.\n\nStatic buildings belong here too. A windmill, a tower, or an architectural detail can all be saved and shared. One player's creation becomes another player's starting point. Together, we can build a richer world.\n", "video": "modules/24_backpack_market/preview.mp4"}, {"id": "23_close", "title": "Conclusion: Build, Refine, and Play in EntropyDrop Space", "label": "结尾三场景回顾", "text": "Looking back across our journey—from air-lifting between floating islands, to tackling wild terrain in an off-road rover, to soaring alongside an autonomous drone—each world highlights the core magic of Space:\n\nAI Agents lower the barrier to creation, turning wild ideas into working machinery in seconds; Hands-on voxel toolkits keep you in total control, banishing uneditable AI black boxes; And it all comes together in an interactive 3D universe running right in your web browser.\n\nThis is EntropyDrop Space. With no client to install, you can open entropydrop.com directly in your browser to start building and exploring today. Describe your ideas, refine them with your own hands, and take them wherever your imagination leads. Thanks for watching, and see you in the game!\n", "video": "modules/23_close/preview.mp4"}];const pick=document.querySelector('#pick');for(const m of modules){const o=document.createElement('option');o.value=m.id;o.textContent=m.id+' · '+m.label;pick.append(o)}function show(){const m=modules.find(m=>m.id===pick.value);document.querySelector('#title').textContent=m.label+' — '+m.title;document.querySelector('#player').src=m.video;document.querySelector('#script').textContent=m.text;const f=document.querySelector('#files');f.textContent='';for(const name of ['module.json','script.en.txt','voice.json']){const a=document.createElement('a');a.href='modules/'+m.id+'/'+name;a.textContent=name;f.append(a,'　')}location.hash=m.id}pick.onchange=show;if(modules.some(m=>m.id===location.hash.slice(1)))pick.value=location.hash.slice(1);show();</script>

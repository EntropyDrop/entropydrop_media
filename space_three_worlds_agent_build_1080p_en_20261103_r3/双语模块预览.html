<script>const items=[{"id": "01_intro", "label": "开场介绍", "zh": "大家好。今天向大家介绍 EntropyDrop Space，一款直接运行在网页浏览器中的 3D 体素游戏。在 Space 里，世界不仅是由方块构成的沙盒，更是一个能够真正运转、可交互的游戏世界。以往在沙盒游戏里制作一台可以驾驶的载具，往往需要耗费大量时间逐块搭建与调试；而单纯依靠文本生成的 3D 模型，又往往是无法微调、不能互动的静态摆件。\n\nSpace 的核心理念，是将“AI 协同建造”与“体素沙盒玩法”结合起来：你可以用自然语言让 AI Agent 协助搭建机械结构与编写控制程序；同时你拥有完整的操作权，随时能拿起工具雕琢微观细节，并亲自坐进驾驶舱在世界中驾驶和探索。接下来，我们将通过三座风貌各异的世界，带大家了解 Space 的整体框架与核心玩法。\n", "en": "Hey everyone. Today, I want to introduce EntropyDrop Space, a 3D voxel game running directly in your web browser. In Space, the world isn't just a sandbox made of blocks—it's an interactive, playable world. Building a drivable machine in traditional sandbox games often takes hours of manual block placement and scripting, while typical generative 3D models tend to be static decorations you can neither customize nor actually play with.\n\nThe core idea behind Space is bringing AI co-creation and voxel sandbox gameplay together: describe what you want in plain words, and an AI Agent helps build functional mechanisms and control scripts for you. At the same time, you retain complete creative control—sculpting micro details with hands-on tools, and jumping into the driver's seat to explore the world yourself. Today, we'll walk through three distinct worlds to showcase how the systems and gameplay in Space actually work.\n"}, {"id": "02_aether_tour", "label": "空岛地形环顾", "zh": "来到以太群岛，先说说我们的设计理念。这里的地形会给创造提出问题：怎么跨过空隙，怎么运送物资，怎么让机器替玩家完成重复劳动？我们希望玩家带着目标去设计，再回到世界里验证。\n\n在这里，人工智能更像一位设计搭档。你用自然语言说明外观、结构和行为，它可以协助搭建载具，编写控制程序；也可以设计会跟随、巡逻的无人机，或者能和玩家互动的机器人玩家。生成只是起点，工具栏让你继续修改、测试，把结果真正变成自己的作品。\n\n我们还想把这种协作扩展到自动化建造。比如让智能体指挥铺路机器人，观察前方地形，一边移动一边修路。载具、机器人和世界因此形成联系：你提出目标，AI 帮你实现，再用实际运行来检验设计。\n", "en": "Here in Aether Archipelago, the terrain gives us a design problem. How do we cross a gap, transport supplies, or let a machine handle repetitive work? We want players to start with a goal, build a solution, and test it in the world.\n\nAI is a design partner. Describe appearance, structure, and behavior in plain language, and it can help build vehicles and write their control code. The same idea extends to following or patrolling drones, and bot players that interact with people. Generation is only the beginning: the toolbar lets you refine, test, and make the result your own.\n\nWe also want to extend this collaboration to automated construction. Imagine an agent directing a road-building robot: it reads the terrain ahead and lays a route as it moves. Vehicles, robots, and the world become connected. You set a goal, AI helps implement it, and real operation puts the design to the test.\n"}, {"id": "03_toolbar", "label": "工具栏设计与用法", "zh": "先看底部工具栏。选择器负责框选空间，锤子用来放置物品，扳手可以抓取、旋转和配置活动实体。铁锹编辑一米见方的标准方块，勺子则用于更细的微体素，每格只有十二点五厘米。\n\n画笔（Brush）负责改变颜色与材质，而建模工具（Modeling）则可以添加精致的视觉装饰构件。数字键 1 到 7 随时切换工具，下方选项也会随当前操作智能切换，简单又直观。\n\n这套工具箱确保了游戏绝不会沦为被动的 AI 盲盒——AI 赋予大结构，而你永远拥有最直观、可预期的方式来检查、修复并打上专属的个性化烙印。\n", "en": "The toolbar at the bottom anchors your moment-to-moment gameplay. Selector defines 3D regions; Hammer places inventory items; and Wrench grabs, rotates, and configures active entities. Shovel shapes standard one-meter blocks, while Spoon operates at an ultra-fine one-eighth of a meter micro-voxel scale.\n\nBrush changes colors and materials on the fly, while Modeling adds lightweight visual decorations. Keys one through seven let you cycle through tools instantly, with contextual controls updating dynamically to keep the workflow clean and intuitive.\n\nThis toolkit ensures you are never trapped by an AI black box. The agent drafts the heavy architecture, while you always hold the precise, intuitive power to refine, personalize, and leave your own creative mark.\n"}, {"id": "04_agent", "label": "Agent Build 授权与工作流", "zh": "这就是 Space 的核心系统：Agent Build。只需打开面板，把提示词复制给你常用的外部 AI Agent，它就能通过开放接口，直接连入当前的体素世界。\n\n无论是主流大模型还是本地 Agent，连接后它就是你的全能建造副驾。它负责理解你的日常自然语言，在几秒内算出三维结构、铺设方块并自动写好底层的控制程序。\n\n一套连接可以在所有世界中无缝复用，省心又高效。现在，让我们进入第一个实机实装演示！\n", "en": "Here is the centerpiece of Space: the Agent Build system. Simply open the panel and copy the prompt to your favorite external AI agent. Through open interfaces, it connects directly into your active voxel world.\n\nWhether using cloud frontier models or local AI, the agent becomes your versatile co-builder. It interprets everyday natural language, computing 3D geometry, placing blocks, and writing full controller scripts in seconds.\n\nThis connection seamlessly carries across every world you visit. Now, let's dive into our first live build!\n"}, {"id": "05_chinook_prompt", "label": "支奴干构建请求", "zh": "在以太群岛，我们需要一架能够跨越空岛的重型空中载具——支奴干纵列双旋翼运输直升机。在 Space 中与 AI 交互非常直观，一段精准的提示词通常涵盖外观、功能结构与操作方式：\n\n请建造一架橄榄绿的运输直升机，包含清晰的座舱、中空的可进入机舱、起落轮和可用的驾驶位。两组旋翼独立旋转，方向相反，通过推力和姿态力矩实现飞行。W 和 S 控制俯仰，A 和 D 控制转向，空格和 Shift 控制升降。\n", "en": "In Aether Archipelago, we need a heavy transport capable of leaping between floating islands: a tandem-rotor Chinook helicopter. Prompting the agent in Space is effortless, combining aesthetics, structure, and flight behavior in a single request:\n\nWe ask the agent to build an olive transport helicopter with a readable cockpit, a hollow walk-in cabin, landing wheels, and a functional pilot seat. The two rotors should be independent components spinning in opposite directions, powered by thrust and attitude torque, with W and S controlling pitch, A and D turning, and the Spacebar and Shift keys managing altitude.\n"}, {"id": "06_chinook_inspect", "label": "支奴干模型检查", "zh": "生成瞬间完成。可以看到，机身与前后两组旋翼都是独立的活动实体组件。\n\n驾驶位也值得单独看一眼。在 Space 里，它不只是机舱中的装饰坐垫，而是带有登机逻辑和输入映射的交互定义，负责把玩家的操作交给飞行器。\n\n绕机身观察，双旋翼间距舒展合理，起落架提供了充裕的离地间隙。最关键的是，整套飞行控制器完全由 Agent 一键生成并编译完成——从双旋翼的反向转矩对冲到自稳悬停算法，复杂的后台代码全部自动搞定，让玩家无需任何编程门槛，直接享受飞行的乐趣。\n", "en": "The generation finishes in seconds. Right away, you can see the fuselage and the two rotor assemblies are independent, active components.\n\nThe pilot seat is a standout feature: in Space, this is a fully functional interaction definition with boarding logic and input mapping, not just a static cushion drawn inside the cabin.\n\nInspecting the exterior, the rotor spacing gives a clear tandem profile, with generous ground clearance under the wheels. Best of all, the entire flight controller was generated and compiled automatically by the agent—from counter-rotating torque cancellation to auto-hover logic, the complex math is handled behind the scenes so you can jump straight into the fun of flying.\n"}, {"id": "07_chinook_refine", "label": "勺子与画笔修补", "zh": "接下来，我们看看生成以后怎样亲手微调。切换到第一人称，暂时停用实体，开始编辑。\n\n拿出勺子工具，对准八分之一米的微体素。沿着机身边缘削出一道小缺口，不用移除整块标准方块，就能像雕刻一样精细地修饰外形。\n\n随后换上画笔（Brush），挑选亮眼的辅色为机体喷绘个性化标识。这就是 Space 的创作魅力：AI 快速帮你完成繁重的基础搭建，而你只需花几秒钟，就能赋予它专属于你的视觉细节。\n", "en": "Now let's see how effortless it is to customize an AI-generated build. We switch into first-person and pause the entity to begin editing.\n\nSelecting Spoon brings up a targeted reticle focused on an eighth-meter micro-voxel. We carve out a clean notch along the edge without removing a full standard block, shaping the airframe with sculptural precision.\n\nSwitching to Brush, we pick an accent color and paint a custom livery detail. This is where Space shines: the AI handles the heavy structural engineering, and in just a few seconds with your own hands, you make the machine truly your own.\n"}, {"id": "08_chinook_controls", "label": "直升机控制与登机", "zh": "在启动飞行前，我们快速看一眼机身控制器。脚本会在后台自动监听驾驶状态：只有当你真正坐进座舱时，按键动力才会解锁。\n\n关闭编辑器，准星对准驾驶位，按下 V 键即可无缝登机；按 F3 键切换至第三人称视角，开阔的视野非常适合空中漫游。\n\n以往在沙盒游戏里，制作这种复杂的多旋翼飞行器需要手写大量的控制代码和物理绑定，足以让绝大多数玩家望而却步。而在 Space 里，你根本不需要懂任何飞行力学或编程，复杂的姿态控制、按键映射与自动悬停逻辑，全部由 Agent 在几秒内全自动化完成。你只管坐进驾驶舱，剩下的全部交给智能副驾。\n", "en": "Before taking off, we take a quick look at the fuselage controller. The script listens automatically for driver mounting, ensuring flight controls only engage when you are safely in the seat.\n\nClose the editor, aim at the pilot seat, and press V to board. Hitting F three toggles our third-person perspective, giving us an expansive view of both the rotors and the archipelago.\n\nIn traditional sandbox games, building a working multi-rotor aircraft required writing pages of scripts and tedious physics tuning that scared off most players. In Space, you don't need any coding or aerospace knowledge. Attitude control, key bindings, and auto-hover stabilization are fully automated by the agent in seconds. You just board the cockpit, and let your intelligent co-builder handle the rest.\n"}, {"id": "09_chinook_flight_a", "label": "支奴干起飞", "zh": "增加升力，直升机从草坪平稳垂直起飞！接下来，轻轻按下前进键，机头自然下俯，推力带着我们向前飞行。\n\n松开按键，飞机自动减速，重新进入稳定悬停。第一个弯我们转得宽一些，让这架重型运输机保留应有的重量和惯性，操控起来沉稳而不急躁。\n\n转过身来，城堡退向身后，阳光穿透天空中的巨环，在云海中勾勒出壮丽的轮廓。逐一测试单项控制，能帮助你在第一时间轻松摸透飞机的操控特性。\n", "en": "Hit the throttle, and the helicopter lifts off smoothly from the grass into a clean vertical climb! Nudging forward input pitches the nose down as thrust propels us forward.\n\nReleasing the keys commands the controller to decelerate and settle into a stable hover. Our first turn is wide and deliberate: a heavy tandem transport should feel substantial, carrying realistic momentum and weight rather than feeling twitchy.\n\nAs the castle slips behind us, sunlight cuts across the skyward ring, revealing an incredible panoramic skyline. Testing each axis one at a time lets you appreciate just how responsive and natural the handling feels.\n"}, {"id": "10_chinook_flight_b", "label": "支奴干环绕飞行", "zh": "切到第三人称，我们从浮岛上空飞过。直升机和远处地形的轮廓清晰，即使没有小地图，也能判断彼此的位置和航向。\n\n在侧倾转弯和俯仰巡航中，整台飞行器表现出极其平顺的自稳质感——松开按键就能稳稳泊在半空，这正是 Agent 智能算法带来的省心体验。\n\n这时候，这架支奴干真正激活了以太群岛的玩法：原本不可逾越的虚空鸿沟，变成了自由翱翔的天空舞台，远方的孤岛随时都能降落探索。\n\n飞行时，远处地形和巨大的世界环始终连贯，展示了无缝加载的效果。空中试飞告一段落，接下来去第二座世界体验越野驾驶！\n", "en": "Cruising over the islands in third-person, the silhouette of the Chinook stands out sharply against the floating terrain, making spatial navigation effortless without needing a minimap.\n\nThroughout every turn and descent, the aircraft maintains rock-solid self-stabilization—simply letting go of the controls parks it in mid-air, a testament to the intelligent auto-hover code generated by the agent.\n\nThis machine unlocks the true gameplay of Aether Archipelago: impassable voids are now open airways, and remote castles become landing sites waiting to be explored.\n\nThe seamless world streaming keeps distant terrain and the massive ring continuous throughout our flight. With our aerial test complete, it's time to head to our second world for some high-speed off-road driving!\n"}, {"id": "11_nature_tour", "label": "Nature 地形游览", "zh": "我们来到第二座世界，自然原野。先把智能建造工具的目标世界，切换到这张地图。\n\n以太群岛高低错落。来到 Nature，眼前是一片连绵的自然荒野，布满天然坡道、岩石和草地阶梯。\n\n我们选定了一片天然起伏的开阔草坡。在 Space 中，你不需要特意修建赛道，崎岖的自然地表本身就是最棒的驾驶乐园。接下来，我们要在这里打造一辆能够征服复杂地形的全地形越野车。\n\n这里的地貌奠定了宏大的世界尺度，也决定了我们接下来的验证顺序：先低速验证车轮滚动，再验证转向几何，最后测试车轮碾过天然台阶时的悬挂形变。\n", "en": "Welcome to our second world: Nature. In Agent Build, we simply update our target world to Nature.\n\nUnlike the vertical drops of Aether, Nature is an expansive rolling wilderness packed with natural slopes, rocky ledges, and stepped grass terraces.\n\nWe pick an open grassy clearing as our starting point. In Space, you don't need to build artificial ramps or test tracks—the rugged procedural earth is already the ultimate off-road proving ground. Here, we're going to build a heavy-duty all-terrain rover.\n\nThis landscape sets the stage for our driving tests: checking low-speed wheel rotation first, testing steering geometry, and finally pushing the independent suspension across natural terraces.\n"}, {"id": "12_rover_prompt", "label": "越野车构建请求", "zh": "这一次向 AI 发起的建造请求聚焦于陆地动力学：建造一辆沙色涂装的硬派四轮越野车，配备坚固车身、明亮前大灯以及充裕的离地间隙。\n\n核心是独立悬挂：一个动态底盘，四只独立活动的车轮。每个接地点都计算弹簧和阻尼力，让轮子随地形起伏，同时具备加速、前轮转向、刹车和侧向抓地力。\n\n这种射线检测式独立悬挂，带来转弯和过坎时真实可感的机械反馈，而不只是原地空转的装饰车轮。\n", "en": "Our second request to the agent focuses on ground physics: build a sand-colored four-wheel, off-road vehicle with a sturdy chassis, high ground clearance, and prominent headlights.\n\nThe heart of the vehicle is its suspension: dynamic chassis, four independently animated wheels, and spring-and-damper forces calculated at every contact point. The wheels must articulate over bumps with responsive acceleration, steering, braking, and lateral grip.\n\nThis independent raycast suspension delivers authentic mechanical behavior you can feel in every turn, far beyond cosmetic wheels that only spin in place.\n"}, {"id": "13_rover_inspect", "label": "悬挂与车体检查", "zh": "越野车瞬间交付。将镜头贴近车轮：车身主体是一个坚固的刚体，而四只车轮则各自安装在独立的悬挂系统上。\n\n每个车轮都会实时探测地面起伏，弹簧吸收冲击，阻尼则抑制颠簸后的多余震荡。如果没有阻尼，车身压过凸起就会持续跳动；如果阻尼过大，整辆车开起来又会显得僵硬死板。\n\n在传统开发中，配置一套能随地形自适应贴合的独立悬挂极其繁琐。但在 Space 里，这套复杂的底盘动力学算法同样由 Agent 全自动生成。你只需提出“要有弹性避震悬挂”，AI 就会自动计算受力并生成控制器，为驾驶提供极其扎实的操控手感。\n", "en": "The rover appears instantly. Dropping our camera to wheel level reveals the setup: a single dynamic chassis root connected to four independently articulated wheel assemblies.\n\nEach wheel samples the terrain in real time. Springs absorb ground impact while dampers suppress unwanted oscillation. Without damping, a chassis bounces uncontrollably after every bump; with too much, it rides like a rigid brick.\n\nIn standard game development, tuning an adaptive multi-wheel suspension is notoriously complex. In Space, the agent generates and balances this entire physics controller automatically. You simply ask for independent suspension, and the AI handles the forces, giving you planted, responsive vehicle handling right out of the box.\n"}, {"id": "16_rover_drive_a", "label": "车轮前进与倒退测试", "zh": "坐进驾驶席，轻踩油门！在车轮高度做极低速的前进与后退测试，仔细观察轮胎花纹的运动趋势。\n\n相对车身来说，向前行驶时，轮胎底部的接触面应该向后滚过地面；倒车时，旋转方向也要随之反过来。\n\n四只宽厚的轮胎牢牢咬住草地，无论是向前开动、平稳刹停，还是挂倒挡后退，轮胎的旋转都与车身动作严丝合缝。如果需要微调动力参数，也随时可以呼叫 Agent 一句话快速优化。\n", "en": "Hop into the driver's seat and tap the accelerator! We run a low-speed crawl forward and backward at ground level to examine tire rotation.\n\nRelative to the chassis, the contact patch of each tire must sweep backward against the terrain as the vehicle drives forward, reversing smoothly when backing up.\n\nThe wide treads grip the grass naturally. Forward acceleration, braking, and reverse motion all synchronize with satisfying mechanical weight. If you ever want to tweak torque or gearing, a single message to your agent updates the script instantly.\n"}, {"id": "17_rover_drive_b", "label": "左右转向与自然台阶越野", "zh": "接下来测试转向。踩住刹车，按 A 键向左打轮，松开回正，再按 D 键向右打轮。两只前轮转向清晰，后轮保持直行方向。\n\n理顺转向轴与车轮车轴的层级关系，可以防止滚动的车轮导致转向轴心晃动，保证高速行驶中的稳定可控。\n\n松开刹车，直接全油门冲向天然台阶！可以看到，当单侧车轮碾过起伏不平的土块时，独立悬挂灵敏压缩回弹，车身平稳跨过障碍，琥珀大灯在原野上划出帅气的弧线。陆地越野的狂飙体验令人大呼过瘾！\n", "en": "Next, we test steering response. Holding the brake, pressing A steers left, releasing returns to center, and pressing D turns right. The front wheels articulate crisply while the rear axle stays true.\n\nKeeping the steering yaw axis on the chassis and the rolling pitch axis on each wheel prevents high-speed wheel wobble, delivering crisp, predictable control.\n\nRelease the brakes and hammer the throttle across natural terraces! As individual wheels tackle rocks and dirt ledges, the suspension compresses and rebounds smoothly, keeping the chassis level while the amber headlights lead the charge. Conquering the wilderness like this is an absolute blast!\n"}, {"id": "18_copper_tour", "label": "铜城地形游览", "zh": "最后一站，我们来到壮丽的铜城（Copper Metropolis）。密集林立的摩天大楼，展现出与空旷野外截然不同的城市航线挑战。\n\n密集的建筑层层叠叠，展示了这个世界丰富的立体层次。再看平直的屋顶边缘：有了水平参照，飞行器哪怕只有一点倾斜，也能看得非常清楚。\n\n面对立体的城市空间，我们将尝试一种更前沿的玩法：不再是人工驾驶载具，而是让 AI 打造一只能够伴随身边的自主跟随无人机。\n\n玩家角色将作为动态移动目标。选定开阔的楼顶作为起点，随后腾空飞起俯瞰整座城市，为无人机的爬升与跟随留出充裕的空间。\n", "en": "Our final stop brings us to Copper Metropolis. Packed with soaring skyscrapers, this world presents an entirely different navigation challenge from open wilderness.\n\nCopper highlights how effortlessly Space renders dense, multi-tiered urban architecture. Sharp horizontal rooflines make every subtle tilt and attitude change easy to read.\n\nIn this vertical cityscape, we explore an even more advanced gameplay mechanic: instead of manually piloting a vehicle, we ask the agent to create an autonomous companion drone that follows our every move.\n\nThe player becomes the moving target. Starting from a spacious rooftop terrace, we take to the air, giving our drone companion plenty of clear airspace to climb, follow, and hover beside us.\n"}, {"id": "19_drone_prompt", "label": "跟随无人机构建请求", "zh": "现在，写下无人机的建造要求，重点说明它怎样跟随角色。\n\n建造一架小型四旋翼无人机，要有动态机身、四个反向对转的旋翼、着陆脚架和醒目的前方标记。\n\n如果靠人工去编写一套能在 3D 空间内实时解算玩家速度、保持空间偏置、并处理失锁保护的动态追踪算法，代码量极为硬核。而在 Space 里，借助 Agent Build，我们只需用日常语言描述需求，AI 就会在后台全自动写出整套智能行为与姿态力矩控制脚本。\n", "en": "To summon this smart aerial companion, we provide the agent with a clear behavioral prompt:\n\nBuild a compact quadcopter companion featuring a dynamic center body, four counter-rotating rotors, landing feet, and a distinct front accent.\n\nWriting a real-time 3D tracking controller that samples velocity, maintains a spatial offset, and handles target loss would normally take hundreds of lines of complex math. In Space, you just describe the behavior in plain English, and the agent automatically writes and compiles the entire autonomous attitude-torque controller for you.\n"}, {"id": "20_drone_refine", "label": "无人机检查与标记", "zh": "无人机出现在露台上，四组反向旋转的旋翼清晰可见。旋转动画配合真实的动态受力，共同构成我们看到的飞行效果。\n\n因为四旋翼在造型上高度对称，在空中快速转动时肉眼很难分清朝向。我们再次拿出画笔，随手在无人机前端点上一抹醒目的亮色标记。一个简单的小动作，就能让飞行器的灵动感倍增。\n\n底部的脚架保证了起降离地间隙。虽然建模工具可以给它外挂精美的装饰外壳，但机体的物理边界始终由核心组件决定。\n", "en": "The drone appears instantly on the terrace, with four counter-rotating rotor arms clearly defined. The visual spinning animations work hand-in-hand with genuine dynamic physics forces.\n\nBecause quadcopters are geometrically symmetrical, reading their heading during rapid aerial spins can be tricky. We whip out the Brush and paint a vivid front accent badge—a two-second touch that brings instant personality to the drone.\n\nSturdy landing feet ensure clean clearance. While Modeling tools can easily add camera gimbals or cosmetic housings, genuine flight behavior always flows from the underlying physics components.\n"}, {"id": "21_drone_flight_a", "label": "角色腾空与无人机跟随", "zh": "现在，我们来看看无人机同行的实际效果。切到第三人称视角，让无人机在身边悬停，随后开启角色飞行模式垂直腾空！\n\n角色离开楼顶，开始沿着城市上方的大圈持续前进。无人机读取角色的位置和速度来追赶；转弯时需要调整推力方向，所以机身会倾斜，而不是直接平移到目标点。\n\n这个测试更接近真正的探索：目标一直在移动，无人机要不断修正距离和高度。把角色和无人机同时留在第三人称画面里，跟随的延迟、转弯的侧倾，就能直接看出来。\n", "en": "Now, let's look at how the drone actually behaves in synchronized flight. In third-person, we let the drone settle beside us, then toggle character flight mode and ascend straight into the air.\n\nWe leave the rooftop and keep moving around a wide circle above the city. The drone tracks our position and velocity. To turn, it must redirect thrust and bank, rather than slide straight to a target.\n\nThis is closer to real exploration. With the target always moving, the drone continuously corrects its distance and altitude. Keeping both characters in third person makes the tracking delay and banking easy to see.\n"}, {"id": "22_drone_flight_b", "label": "空中环顾、侧移与悬停", "zh": "接下来，角色沿空中的大圆继续快速飞行。楼宇从身边掠过，无人机持续追上来，镜头跟着航线转动，把这一整圈的移动过程连起来。\n\n留意转弯时的姿态：无人机向弯内侧倾，改变加速度方向；角色调整速度，它也要重新分配推力，修正跟随误差。最后松开输入，我们再看看它怎样减速、回到悬停。\n\n这样的伙伴才和玩法联系起来：你负责探索和选择路线，它用自己的控制逻辑跟上你。以后再加入侦察、巡逻或搬运，就能发展出更多用途。\n", "en": "We continue flying quickly around the large circle. Buildings pass below, the drone keeps catching up, and the camera follows our route so the movement reads as one continuous flight.\n\nWatch the drone bank into each turn, redirecting acceleration rather than sliding sideways. When we change speed, it adjusts thrust to correct the tracking error. It's constantly balancing distance and altitude, so the follower stays responsive while the target keeps moving.\n\nNow we release the controls and let it settle. You choose the route; the drone follows through its own logic. Scouting, patrols, or hauling could give this companion more gameplay roles.\n"}, {"id": "24_backpack_market", "label": "背包与市场", "zh": "结束之前，再打开背包看看。刚才创造的载具，可以保存成背包里的物品，下次需要时再拿出来放置。背包不只是收纳成品，它也可以成为我们自己的零件库。\n\n比如这辆越野车，不必每次都从零制作四个轮子。我们可以选中轮胎组件，把它单独复制进背包。以后设计另一辆车，就能复用这套轮胎，再按照新车的需求调整尺寸、颜色和结构。\n\n直升机也一样。旋翼可以作为独立模块保存下来，机身、起落架和其他组件也能分别整理。这样，创造一辆新载具，就可以从组合已有模块开始，把精力放在新的设计和玩法上。\n\n打开旁边的市场，就能浏览其他玩家分享的作品。自己的组件也可以发布到这里，让其他玩家下载使用。分享的既可以是一辆完整载具，也可以只是一个轮胎或一组旋翼。\n\n这套创造和分享的方式，也适用于静态建筑。一座风车、一座塔，或者一段建筑装饰，都可以保存并分享。我们希望每位玩家的创造，都能成为其他人的起点，让大家一起把这个世界搭建得更丰富。\n", "en": "Before we finish, let's open the backpack. Save a vehicle here and place it again later. Think of it as both a collection of finished creations and your own reusable parts library.\n\nTake this rover. Select a wheel component and copy it into the backpack. When you design another vehicle, reuse that wheel, then adjust its size, color, and structure to suit the new build.\n\nThe helicopter works the same way. Save a rotor as its own module, and organize the fuselage and landing gear separately. New vehicles can start by combining existing parts, leaving more time for design and gameplay.\n\nThe market lets you browse other players' creations and share your own. Others can download and reuse a complete vehicle, a single tire, or a rotor assembly. Each contribution can become part of someone else's build.\n\nStatic buildings belong here too. A windmill, a tower, or an architectural detail can all be saved and shared. One player's creation becomes another player's starting point. Together, we can build a richer world.\n"}, {"id": "23_close", "label": "结尾三场景回顾", "zh": "回顾这次旅程：我们在以太群岛驾驶直升机跨越虚空，在自然原野开越野车翻过台阶，最后与无人机结伴飞过铜城。三种体验，展示了 Space 的核心魅力。\n\n先把想法描述清楚，系统就会帮你搭好机械结构，并生成控制程序。精细的体素工具把修改权留在玩家手里，生成之后也能亲手调整。最后，这一切汇聚成一个可以互动、可以探索的三维世界，直接打开浏览器就能体验。\n\n这就是 EntropyDrop Space。无需下载客户端，直接在浏览器中打开 entropydrop.com，就能开启你的创造与探索。用想法描述构想，亲手赋予它细节，然后开着它驶向远方。感谢大家收看，我们游戏里见！\n", "en": "Looking back across our journey—from air-lifting between floating islands, to tackling wild terrain in an off-road rover, to soaring alongside an autonomous drone—each world highlights the core magic of Space:\n\nAI Agents lower the barrier to creation, turning wild ideas into working machinery in seconds; Hands-on voxel toolkits keep you in total control, banishing uneditable AI black boxes; And it all comes together in an interactive 3D universe running right in your web browser.\n\nThis is EntropyDrop Space. With no client to install, you can open entropydrop.com directly in your browser to start building and exploring today. Describe your ideas, refine them with your own hands, and take them wherever your imagination leads. Thanks for watching, and see you in the game!\n"}],orders={"zh": ["01_intro", "02_aether_tour", "03_toolbar", "04_agent", "05_chinook_prompt", "06_chinook_inspect", "07_chinook_refine", "08_chinook_controls", "09_chinook_flight_a", "10_chinook_flight_b", "11_nature_tour", "12_rover_prompt", "13_rover_inspect", "16_rover_drive_a", "17_rover_drive_b", "18_copper_tour", "19_drone_prompt", "20_drone_refine", "21_drone_flight_a", "22_drone_flight_b", "24_backpack_market", "23_close"], "en": ["01_intro", "02_aether_tour", "03_toolbar", "04_agent", "05_chinook_prompt", "06_chinook_inspect", "07_chinook_refine", "08_chinook_controls", "09_chinook_flight_a", "10_chinook_flight_b", "11_nature_tour", "12_rover_prompt", "13_rover_inspect", "16_rover_drive_a", "17_rover_drive_b", "18_copper_tour", "19_drone_prompt", "20_drone_refine", "21_drone_flight_a", "22_drone_flight_b", "24_backpack_market", "23_close"]};
const pick=document.querySelector('#module'),lang=document.querySelector('#language'),player=document.querySelector('#player');
function populate(id){pick.replaceChildren();for(const mid of orders[lang.value]){const m=items.find(x=>x.id===mid),o=document.createElement('option');o.value=mid;o.textContent=mid+' · '+m.label;pick.append(o)}if(orders[lang.value].includes(id))pick.value=id;}
function show(){const m=items.find(x=>x.id===pick.value),l=lang.value;document.querySelector('#title').textContent=m.label;player.src='modules/'+m.id+'/preview'+(l==='zh'?'.zh':'')+'.mp4';document.querySelector('#master').href='exports/space_three_worlds_'+(l==='zh'?'zh_':'')+'latest.mp4';document.querySelector('#script').textContent=m[l];document.querySelector('#scriptfile').href='modules/'+m.id+'/script.'+l+'.txt';history.replaceState(null,'','#'+m.id+'/'+l)}
pick.onchange=show;lang.onchange=()=>{populate(pick.value);show()};const [id,l]=location.hash.slice(1).split('/');if(['en','zh'].includes(l))lang.value=l;populate(id);show();</script></html>

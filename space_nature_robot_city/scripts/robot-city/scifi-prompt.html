<main id="document"><small>SPACE 开发日志 · 需求示例</small><h1>先讲清目标、变化和约束</h1>
<div class="lead">在 Nature 地形上，让五台独立四旋翼协作建城。资源无限，不需要运输机。</div>
<div class="cards"><section class="card"><span class="n">01</span><h2>想创造什么</h2><p>科幻高楼与低层街区<br>连通的多层立交<br>街道、广场与屋顶绿化</p></section>
<section class="card"><span class="n">02</span><h2>允许哪些变化</h2><p>楼层、宽度、退台与外立面<br>道路坡度与转弯半径<br>树高、树冠、分枝与种子</p></section>
<section class="card"><span class="n">03</span><h2>必须遵守什么</h2><p>建筑入口接路，车道保持畅通<br>道路验收后建楼，楼体验收后植树<br>每项建筑任务只有一位负责人</p></section></div>
<div class="foot">把这些需求交给外部 Agent，迭代蓝图与控制脚本。运行中的无人机按各自脚本和消息协作。</div></main>
